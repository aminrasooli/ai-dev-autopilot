name: Goal
description: Give the autopilot a goal. This is the only intake path — nothing else is required.
title: "[goal] "
labels: ["goal"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue **is** the operator touch. The controller plans from
        open goal issues authored by the repository owner; no brief is pasted
        into a session, and no other channel requests work.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do you want? One goal per issue.
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will the controller know it is done? Prefer a command that exits 0.
      placeholder: "e.g. `bash tests/run-all.sh` passes and README states the measured count"
    validations: {required: true}
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What must NOT be touched. Protected paths are always excluded regardless.
      placeholder: "e.g. do not change the corpus; docs only"
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["1 - next", "2 - soon", "3 - whenever"]
    validations: {required: true}
