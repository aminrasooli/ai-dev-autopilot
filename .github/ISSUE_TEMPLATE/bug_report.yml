name: Bug report
description: Something behaves differently from what the documentation or tests claim.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **Is this a security vulnerability?** A way to reach an allow for a
        human-only boundary, make the broker fail open, or let a checked-out
        repository influence the session that inspects it must go through
        [private vulnerability reporting](https://github.com/aminrasooli/ai-dev-autopilot/security/advisories/new)
        instead — see
        [SECURITY.md](https://github.com/aminrasooli/ai-dev-autopilot/blob/main/SECURITY.md).
        No details in public issues.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: >-
        `bin/doctor` reports X, but the deployed settings say Y…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce, from a clean clone
      description: >-
        Start from `git clone` of this repository. List which `make` targets
        you ran, in order (`make sync`, `make manage`, `make deps`, …), then the
        exact command or tool call that shows the problem. If a permission
        decision is involved, give the exact command text.
      placeholder: |
        1. git clone https://github.com/aminrasooli/ai-dev-autopilot.git ~/.ai-dev
        2. cd ~/.ai-dev && make sync
        3. In a Claude Code session in another project: ran `cat ~/.ssh/id_rsa`
      render: sh
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Expected decision vs. actual decision
      description: >-
        Every permission outcome is one of allowed / asked / blocked. State
        which one you expected and which one you got.
      placeholder: |
        Expected: blocked ([cred-path])
        Actual: allowed
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >-
        Much of what this project asserts is measured against vendor behaviour
        that changes between releases, so versions matter.
      placeholder: |
        AI Dev Autopilot commit:
        Claude Code version (claude --version):
        Codex CLI version, if installed:
        OS and version:
    validations:
      required: true
  - type: textarea
    id: suite
    attributes:
      label: What the test suite says
      description: >-
        Output of `make test` (or the one suite that covers the area), if you
        ran it. `PENDING` on an undeployed machine is normal.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: make doctor output
      description: >-
        Paste the output of `make doctor`. **Remove anything private first** —
        your username, hostname, absolute home-directory paths, or anything
        else that identifies your machine. PENDING entries on an undeployed
        machine are normal.
      render: text
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: >-
            This is not a security vulnerability (those go through private
            vulnerability reporting, with no details in public).
          required: true
        - label: >-
            The report contains no credentials, tokens, private hostnames or
            other machine-identifying detail.
          required: true
